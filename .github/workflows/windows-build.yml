name: Windows build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Install PyInstaller
        run: python -m pip install 'pyinstaller>=6,<7'
      - name: Build standalone Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MovieSortPro MovieSortPro.py
      - name: Package release ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/MovieSortPro.exe -DestinationPath MovieSortPro-Windows.zip -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieSortPro-Windows
          path: MovieSortPro-Windows.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged version
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MovieSortPro-Windows
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: MovieSortPro-Windows.zip
          generate_release_notes: true
