name: Bug report
description: Report a reproducible defect, especially copy/move or repeat-run issues
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Before submitting, redact API keys, your Windows username, personal paths, and movie lists."
  - type: input
    id: version
    attributes:
      label: MovieSort Pro version
      placeholder: "v2.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Operation
      options: [Copy, Move, Scan only, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Explain first and second runs, including whether source or destination changed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and redacted report
    validations:
      required: true
