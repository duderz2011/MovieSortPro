name: Feature request
description: Suggest a new movie sorting rule, provider, or improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should MovieSort Pro do?
      description: Describe the scenario and desired behaviour, avoiding private filenames.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example folder layout
      description: Optional fictional file-path example.
